events {
    worker_connections 1024;  # Maximum number of simultaneous connections
}

http {
    # SSL settings applied globally
    ssl_protocols TLSv1.3;  # Enable TLSv1.3 only
    ssl_prefer_server_ciphers off;  # Do not prefer server ciphers

    upstream app_py {
        ip_hash;  # Use ip_hash to achieve better session stickiness
        server 192.168.30.105:8080;
        server 192.168.30.110:8080;
        server 192.168.30.115:8080;
    }

    upstream app_landing_py {
        ip_hash;  # Use ip_hash to achieve better session stickiness
        server 192.168.30.105:8079;
        server 192.168.30.110:8079;
        server 192.168.30.115:8079;
    }

    # Map upstream address to IP
    map $upstream_addr $upstream_ip {
        default "Onbekend";
        ~^(?<ip>[^:]+):(?<port>[^:]+)$ $ip;
    }

    # Map upstream address to port
    map $upstream_addr $upstream_port {
        default "Onbekend";
        ~^(?<ip>[^:]+):(?<port>[^:]+)$ $port;
    }

    # Map upstream IP to a friendly name
    map $upstream_ip $upstream_name {
        default "Onbekend";
        "192.168.30.105" "front-end01";
        "192.168.30.110" "front-end02";
        "192.168.30.115" "front-end03";
    }

    # saxcoin-b6.online and www.saxcoin-b6.online pointing to app_py
    server {
        listen 80;
        listen [::]:80;
        server_name saxcoin-b6.online www.saxcoin-b6.online;

        location / {
            proxy_pass http://app_py;  # Pass requests to the upstream group "app_py"
            proxy_set_header Host $host;  # Preserve the original Host header
            proxy_set_header X-Real-IP $remote_addr;  # Pass the real client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Add X-Forwarded-For header
            proxy_set_header X-Forwarded-Proto $scheme;  # Add X-Forwarded-Proto header

            # Add a custom header to indicate the frontend server
            proxy_set_header X-Frontend-Server $upstream_addr;

            # Add a cookie to the response
            add_header Set-Cookie "SERVERID=$upstream_addr; Path=/";

            # Enable sub_filter to modify the response body
            sub_filter '</nav>' '</nav><div style="text-align: center; padding: 10px; background-color: #f8f9fa; margin-bottom: 20px;">Momenteel verbonden met: $upstream_name op $upstream_ip op poort $upstream_port</div><div style="height: 40px;"></div>';
            sub_filter_once on;
            sub_filter_types text/html;  # Apply the sub_filter to text/html content
        }

        error_page 404 /custom_404.html;
        location = /custom_404.html {
            root /usr/share/nginx/html;  # Adjust this path to your custom 404 page location
            internal;
        }

        location = /status {
            stub_status;  # Enable stub status module for server status
            access_log off;  # Disable access log for this location
            allow 127.0.0.1;  # Allow requests from localhost only
            deny all;  # Deny all other requests
        }

        # Add security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    }

    # saxcoin-b6.nl and www.saxcoin-b6.nl pointing to app_landing_py
    server {
        listen 80;
        listen [::]:80;
        server_name saxcoin-b6.nl www.saxcoin-b6.nl;

        location / {
            proxy_pass http://app_landing_py;  # Pass requests to the upstream group "app_landing_py"
            proxy_set_header Host $host;  # Preserve the original Host header
            proxy_set_header X-Real-IP $remote_addr;  # Pass the real client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Add X-Forwarded-For header
            proxy_set_header X-Forwarded-Proto $scheme;  # Add X-Forwarded-Proto header

            # Add a custom header to indicate the frontend server
            proxy_set_header X-Frontend-Server $upstream_addr;

            # Add a cookie to the response
            add_header Set-Cookie "SERVERID=$upstream_addr; Path=/";

            # Enable sub_filter to modify the response body
            sub_filter '</nav>' '</nav><div style="font-size: 12px; color: #fff; float: right; padding-right: 15px;">Server: $upstream_name | IP: $upstream_ip | Poort: $upstream_port</div>';
            sub_filter_once on;
            sub_filter_types text/html;  # Apply the sub_filter to text/html content
        }

        error_page 404 /custom_404.html;
        location = /custom_404.html {
            root /usr/share/nginx/html;  # Adjust this path to your custom 404 page location
            internal;
        }

        location = /status {
            stub_status;  # Enable stub status module for server status
            access_log off;  # Disable access log for this location
            allow 127.0.0.1;  # Allow requests from localhost only
            deny all;  # Deny all other requests
        }

        # Add security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    }

    server {
        listen 8079;
        listen [::]:8079;
        server_name _;  # This server block listens on port 8079 for any host

        location / {
            proxy_pass http://app_landing_py;  # Pass requests to the upstream group "app_landing_py"
            proxy_set_header Host $host;  # Preserve the original Host header
            proxy_set_header X-Real-IP $remote_addr;  # Pass the real client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Add X-Forwarded-For header
            proxy_set_header X-Forwarded-Proto $scheme;  # Add X-Forwarded-Proto header

            # Add a custom header to indicate the frontend server
            proxy_set_header X-Frontend-Server $upstream_addr;

            # Add a cookie to the response
            add_header Set-Cookie "SERVERID=$upstream_addr; Path=/";

            # Enable sub_filter to modify the response body
            sub_filter '</nav>' '</nav><div style="font-size: 12px; color: #fff; float: right; padding-right: 15px;">Server: $upstream_name | IP: $upstream_ip | Poort: $upstream_port</div>';
            sub_filter_once on;
            sub_filter_types text/html;  # Apply the sub_filter to text/html content
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name saxcoin-b6.online www.saxcoin-b6.online saxcoin-b6.nl www.saxcoin-b6.nl;
        ssl_certificate /etc/letsencrypt/live/saxcoin-b6.online/fullchain.pem;  # SSL certificate file
        ssl_certificate_key /etc/letsencrypt/live/saxcoin-b6.online/privkey.pem;  # SSL certificate key file
        include /etc/letsencrypt/options-ssl-nginx.conf;  # SSL options
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;  # DH parameters file

        location / {
            proxy_pass http://app_py;  # Pass requests to the upstream group "app_py"
            proxy_set_header Host $host;  # Preserve the original Host header
            proxy_set_header X-Real-IP $remote_addr;  # Pass the real client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Add X-Forwarded-For header
            proxy_set_header X-Forwarded-Proto $scheme;  # Add X-Forwarded-Proto header

            # Add a custom header to indicate the frontend server
            proxy_set_header X-Frontend-Server $upstream_addr;

            # Add a cookie to the response
            add_header Set-Cookie "SERVERID=$upstream_addr; Path=/";

            # Enable sub_filter to modify the response body
            sub_filter '</nav>' '</nav><div style="text-align: center; padding: 10px; background-color: #f8f9fa; margin-bottom: 20px;">Momenteel verbonden met: $upstream_name op $upstream_ip op poort $upstream_port</div><div style="height: 40px;"></div>';
            sub_filter_once on;
            sub_filter_types text/html;  # Apply the sub_filter to text/html content
        }

        location /landing {
            proxy_pass http://app_landing_py;  # Pass requests to the upstream group "app_landing_py"
            proxy_set_header Host $host;  # Preserve the original Host header
            proxy_set_header X-Real-IP $remote_addr;  # Pass the real client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Add X-Forwarded-For header
            proxy_set_header X-Forwarded-Proto $scheme;  # Add X-Forwarded-Proto header

            # Add a custom header to indicate the frontend server
            proxy_set_header X-Frontend-Server $upstream_addr;

            # Add a cookie to the response
            add_header Set-Cookie "SERVERID=$upstream_addr; Path=/";
        }

        error_page 404 /custom_404.html;
        location = /custom_404.html {
            root /usr/share/nginx/html;  # Adjust this path to your custom 404 page location
            internal;
        }

        location = /status {
            stub_status;  # Enable stub status module for server status
            access_log off;  # Disable access log for this location
            allow 127.0.0.1;  # Allow requests from localhost only
            deny all;  # Deny all other requests
        }

        # Add security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    }
}