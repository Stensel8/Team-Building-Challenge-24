<!doctype html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$ax¢oin | {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="../static/base.css">
    <style>
        body {
            padding-top: 0;
            margin: 0;
        }
        .server-status {
            text-align: center;
            padding: 10px;
            background-color: #f8f9fa;
        }
        .coin-block {
            display: block;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            text-decoration: none;
            color: inherit;
        }
        .coin-block:hover {
            background-color: #419984;
            color: #fff;
        }
        .coin-block img {
            transition: transform 0.3s ease;
        }
        .coin-block:hover img {
            transform: scale(1.1);
        }
        #cache-warning {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: #419984;
            color: white;
            padding: 10px;
            border: 1px solid #3a7d70;
            border-radius: 5px;
            z-index: 1000;
            width: 300px;
        }
        @media (max-width: 768px) {
            #cache-warning {
                width: 90%;
                left: 5%;
                right: 5%;
            }
        }
        .header-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-home {
            background-color: #6cff47;
            color: white;
            border: none;
        }
        .btn-home:hover {
            background-color: #25c575;
        }
    </style>
</head>

<body>
    <header class="text-center my-0">
        {% block header %}
        <div class="header-buttons">
            <h1>$ax¢oin-b6.online - Coins</h1>
            <button type="button" class="btn btn-home" data-bs-toggle="modal" data-bs-target="#homeModal">Home</button>
        </div>
        <div class="version-info">Frontend V0.2</div>
        {% endblock %}
    </header>
    <div class="container">
        {% block nav %}{% endblock %}
        {% block body %}{% endblock %}
    </div>

    <!-- Home Modal -->
    <div class="modal fade" id="homeModal" tabindex="-1" aria-labelledby="homeModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="homeModalLabel">Welke homepagina wilt u zien?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <button type="button" class="btn btn-primary btn-block" onclick="goToIntern()">Intern</button>
                    <button type="button" class="btn btn-secondary btn-block" onclick="goToExtern()">Extern</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function goToIntern() {
            window.location.href = "http://192.168.20.102:8079";
        }

        function goToExtern() {
            window.location.href = "http://saxcoin-b6.nl";
        }
    </script>
</body>
</html>
